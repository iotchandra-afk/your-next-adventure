name: Live intake
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'config/sources.json'
      - '.github/workflows/intake.yml'
permissions:
  contents: read
concurrency:
  group: live-intake
  cancel-in-progress: true
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://rpgaxevgnzyasysyvnqz.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Unit tests
        run: pytest -q backend/tests
      - name: Run broad intake below the glass
        run: python -m yna.intake_batch
