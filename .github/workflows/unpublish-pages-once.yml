name: Unpublish GitHub Pages once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpublish-pages-once.yml'
permissions:
  contents: read
  pages: write
jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${GH_REPO}/pages"
