name: False-negative audit
on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit.yml'
      - 'backend/yna/audit.py'
      - 'backend/yna/triage.py'
      - 'backend/yna/job_detail.py'
      - 'backend/yna/model_router.py'
      - 'backend/tests/test_audit.py'
permissions:
  contents: read
concurrency:
  group: false-negative-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rpgaxevgnzyasysyvnqz.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: backend
      AUDIT_LIMIT: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend regression tests
        run: pytest -q backend/tests
      - name: Independently audit hidden rejections with Astra
        run: python -m yna.audit
