name: Model availability smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-smoke.yml'
permissions:
  contents: read
concurrency:
  group: model-runtime
  cancel-in-progress: false
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://rpgaxevgnzyasysyvnqz.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Verify configured runtime models are actually available
        run: python -m yna.model_smoke
