name: Deep qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-runtime
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://rpgaxevgnzyasysyvnqz.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: backend
      QUALIFY_LIMIT: '6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backend regression tests
        run: pytest -q backend/tests
      - name: Prioritize relevant opportunities with Astra
        run: python -m yna.qualification
